<!doctype html>
<html lang="en">
  <head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="stylesheet" href="src/ui/ui.css"><title>Galactic Library</title></head>
  <body>
    <main class="page">
      <header><h1>Galactic Library</h1><p>Your browser-local digital library. No account, cloud, analytics, or password collection.</p></header>
      <section aria-labelledby="providers-heading"><h2 id="providers-heading">Libraries</h2><div id="providers" class="providers"></div><p class="muted">Steam and GOG connectors are the next milestone. This foundation deliberately has no site permissions yet.</p></section>
      <section aria-labelledby="library-heading"><div class="section-heading"><h2 id="library-heading">Games</h2><input id="search" type="search" placeholder="Search your library" aria-label="Search games"></div><p id="library-summary" role="status"></p><ol id="library-items" class="library-items"></ol></section>
      <section aria-labelledby="backup-heading"><h2 id="backup-heading">Backup</h2><div class="actions"><button id="export">Export backup</button><label class="button-like" for="import">Import backup<input id="import" type="file" accept="application/json,.json" hidden></label><button id="clear" class="danger">Clear local library</button></div><p id="backup-status" role="status"></p></section>
    </main>
    <script type="module" src="src/ui/options.js"></script>
  </body>
</html>
